[package]
name = "keysteer"
version = "0.9.6"
authors = ["dccif"]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "Keyboard-driven mouse control with grid, recursive-grid and accessibility hint modes"
repository = "https://github.com/dccif/KeySteer"
homepage = "https://dccif.github.io/KeySteer/"
documentation = "https://dccif.github.io/KeySteer/"
default-run = "keysteer"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"

# A single crate: the public API, the engine, the built-in modes and every
# platform backend live in one package under `src/`. Backends are selected by
# `cfg(target_os)` below, so `cargo build` / `cargo build --target ...` needs no
# extra flags, features or edits on any platform.
[lib]
name = "keysteer"
path = "src/lib.rs"

[[bin]]
name = "keysteer"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
miniz_oxide = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = { version = "0.11", default-features = false }
smallvec = { version = "1.15", features = ["union"] }
toml = "1.1.4"
toml_edit = "0.25"
# update.rs explicitly selects NativeTls because ureq defaults to Rustls. The
# `native-tls-no-default` helper alone does not compile ureq's HTTPS connector.
ureq = { version = "3.3", default-features = false, features = ["json", "native-tls"] }
[features]
default = []
perf-probe = []

# ---------------------------------------------------------------------------
# Platform backends. Cargo evaluates these against the *target*, so the right
# backend is compiled automatically and the others are never even downloaded.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSDate", "NSEnumerator", "NSRange", "NSRunLoop", "NSString", "NSValue", "NSURL", "NSUserDefaults", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CADisplayLink",
    "CALayer",
    "CAShapeLayer",
    "CATextLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "CGColor",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGPath",
    "CGRemoteOperation",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFString"] }
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontTraits",
    "objc2-core-graphics",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-quartz-core",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSImageView",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-text",
] }
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "windows")'.dependencies.windows-numerics]
version = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies.windows-collections]
version = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies.windows-future]
version = "0.3.2"

[target.'cfg(any(windows, target_os = "macos"))'.build-dependencies]
cc = "1.2"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
loom = "0.7.2"

[dev-dependencies]
stats_alloc = "0.1.10"

[[bench]]
name = "core_hot_paths"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
