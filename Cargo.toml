[package]
name = "keysteer"
version = "0.15.5"
authors = ["dccif"]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Keyboard-driven mouse control with grid, recursive-grid and accessibility hint modes"
repository = "https://github.com/dccif/KeySteer"
homepage = "https://dccif.github.io/KeySteer/"
documentation = "https://dccif.github.io/KeySteer/"
default-run = "keysteer"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
raw_borrows_via_references = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
base64 = "0.23.1"
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = { version = "0.11.1", default-features = false }
smallvec = { version = "1.16.4", features = ["union"] }
toml = "1.2.0"
toml_edit = "0.25.18"
# update.rs selects NativeTls; its HTTPS connector requires `native-tls`.
ureq = { version = "3.5.1", default-features = false, features = ["json", "native-tls"] }
smol_str = "0.3.7"
unicode-segmentation = "1.13.3"
rustc-hash = "2.1.3"
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }
arboard = { version = "3.7.0", default-features = false }

[features]
default = []
# Lifecycle diagnostics; keep disabled for performance measurements.
perf-probe = []

# Native dependencies are selected by the compilation target.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
block2 = "0.6.2"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSDate", "NSEnumerator", "NSKeyValueObserving", "NSNotification", "NSRange", "NSRunLoop", "NSString", "NSValue", "NSURL", "NSUserDefaults", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CADisplayLink",
    "CALayer",
    "CAShapeLayer",
    "CATextLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGColor",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGPath",
    "CGRemoteOperation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNotificationCenter", "CFRunLoop", "CFString"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "CTFont",
    "CTFontTraits",
    "CTLine",
    "objc2-core-graphics",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-quartz-core",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSImageView",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSTextField",
    "NSText",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-text",
] }
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Data_Text",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows-collections = "0.3.2"
windows-future = "0.3.2"

[build-dependencies]
# Build scripts run on the host, including Linux during Windows cross builds.
cc = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dev-dependencies]
loom = "0.7.2"

[dev-dependencies]
stats_alloc = "0.1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
