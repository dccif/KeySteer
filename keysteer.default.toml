# KeySteer — common settings and complete default key bindings.
# Omitted fields use built-in defaults. User profiles: keysteer.<name>.toml.
# A bindings table replaces that mode's defaults; keep the keys you need.
# Primary is left Alt on Windows and Command on macOS.
# Portable: beside the executable. macOS app: ~/Library/Application Support/KeySteer/.
# Check: keysteer --check -c keysteer.default.toml
# Full values: keysteer --dump-config
# Guide: https://dccif.github.io/KeySteer/reference/configuration
# Bindings: "+" combines keys; spaces separate alternatives; "none" disables a key.

# Applications excluded from activation.
[general]
excluded_apps = []

# Key aliases can also be defined globally or under key_aliases.macos.
[key_aliases.windows]
Primary = "left_alt"

# Theme colors: #RRGGBBAA. Overrides may use { light = "...", dark = "..." }.
[theme.dark]
surface = "#0A1338FF"
accent = "#6E82D6FF"
accent_alt = "#8FA2F0FF"
on_accent_alt = "#081022FF"
text = "#E8EEFFFF"

[theme.light]
surface = "#EEF2FFFF"
accent = "#465FBCFF"
accent_alt = "#0B2377FF"
on_accent_alt = "#F8FAFFFF"
text = "#17327AFF"

# Global launchers.
[hotkeys]
"alt+w" = "window"
"primary+e" = "normal"

# Normal: move, click and scroll. Unbound keys pass through to the application.
[normal]
inherits = ["hotkeys"]
passthrough_unbound_keys = true
long_press_toggle_ms = 500 # 0 disables long-press latching.
auto_release_ms = 0 # 0 keeps manual release; otherwise delay after modifier-drag stops.

# Hold a speed key with a direction; tap a click key or hold it to latch.
[normal.bindings]
"?" = "key_help"
'\' = "text_input"
h = "move_left"
j = "move_down"
k = "move_up"
l = "move_right"
caps_lock = "precision"
left_shift = "slow"
"v b" = "fast"
m = "wheel_down"
"," = "wheel_up"
"." = "scroll_left"
"/" = "scroll_right"
";" = "left_click"
"'" = "right_click"
right_shift = "middle_click"
n = "toggle"
g = "grid"
f = "ui_hint"
"primary+g" = "recursive_grid"
"primary+f" = "bisect"
c = "text_select"
"primary+s" = "screen next"
"primary+d" = "move_window next"
u = "page_down"
i = "page_up"
t = "home"
y = "end"
"q esc" = "idle"

# Text Input: all other keys, including Cmd/Ctrl shortcuts, go to the application.
# Enter, backslash or Esc returns to Normal; remove Enter here for multiline typing.
[text_input.bindings]
'enter \ esc' = "normal"
# Optional: send Enter before returning; replace the grouped binding above:
# '\ esc' = "normal"
# enter = ["send enter", "normal"]

# OCR text selection has its own scope; OCR options and panel appearance follow UI Hint.
[text_select]
enabled = true
scan_scope = "all" # 独立扫描范围，默认全部屏幕 / Independent scope: window / active / screen / all (default).
hint_characters = "asdfghjklqwertyuiopzvbnm"

[text_select.lifecycle]
after_copy = "normal"

[text_select.bindings]
"alt+c" = "text_refine"
"alt+backspace" = "previous_level"
"ctrl+backspace" = "first_level"
tab = "text_cycle_page"

"ctrl+a" = "text_select_all"
backspace = "text_clear_selection"
"ctrl+x" = "text_clear_input"
"mod+c enter" = "text_copy"

"primary+q" = "normal"
esc = "cancel_selection"
"?" = "key_help"

# Window modes have independent bindings; Q follows each mode's binding.
# The target/screens/temporary-mode options also apply to Quick, Editor, Restore and Tabs.
# Optional entry priority: "active" or "mouse"; omit to preserve session handoffs.
[window]
# target = "active"
screens = "all" # "current" = current screen; "all" = all screens (Window default).
include_minimized = false
enabled = true
inherits = ["hotkeys"]
temporary_mode = "normal" # Hold Primary to borrow Normal.
temporary_mode_keys = ["primary"]
temporary_mode_passthrough_keys = ["ctrl", "ctrl+x"] # Keep multi-selection keys in Window.
number_timeout_ms = 250
move_step = 20.0
move_speed = 600.0
resize_step = 20.0
resize_speed = 500.0
border_width = 3.0

[window.bindings]
"?" = "key_help"
g = "grid"
"primary+f" = "recursive_grid"
h = "window_left"
j = "window_down"
k = "window_up"
l = "window_right"
s = "window_size"
a = "window_quick"
e = "window_editor"
t = "window_tab"
r = "window_restore"
d = "window_screen_next"
f = "window_maximize"
"shift+f" = "window_minimize"
c = "window_center"
x = "window_close"
tab = "window_select"
"shift+tab" = "window_select_previous"
"v+j" = "window_volume_down"
"v+k" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+h" = "window_audio_previous"
"v+l" = "window_audio_next"
"shift+v+j" = "window_system_volume_down"
"shift+v+k" = "window_system_volume_up"
"shift+v+h" = "window_system_audio_previous"
"shift+v+l" = "window_system_audio_next"
z = "window_undo"
"shift+z" = "window_redo"
"shift+c" = "window_reset_initial"
"ctrl" = "window_multi_select"
"ctrl+x" = "window_multi_clear"
q = "idle"
"primary+q" = "idle"

# Active only while typing selection numbers. Ctrl/Enter confirms; Backspace edits.
[window.multi_select.bindings]
esc = "window_multi_cancel"
"backspace" = "send backspace"
"delete" = "send delete"
"arrow_left" = "send arrow_left"
"arrow_right" = "send arrow_right"
"home" = "send home"
"end" = "send end"
"ctrl enter" = "window_multi_confirm"
"primary+h" = "arrow_left"
"primary+l" = "arrow_right"

# Shared card style for Window, Quick, Editor, Restore and Tabs.
# Omitted colors inherit the theme; 0 font size follows the window UI.
[window.card]
guide_line_enabled = true
guide_line_width = 3.0
position_mode = "window" # "window" or "screen".
position = ["50%", "50%", "50%", "50%"]
app_font_size = 0.0
title_font_size = 0.0
app_font_family = ""
title_font_family = ""
app_bold = true
title_bold = false
text_width = 260.0
padding_x = 9.0
padding_y = 4.0
line_height = 1.4
min_height = 44.0
number_min_width = 38.0

[window.ui]
font_size = 28

# Quick: directional split ratios, followed by full-screen size.
[window_quick]
screens = "current"
include_minimized = false
enabled = true
inherits = ["hotkeys"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]
number_timeout_ms = 250
split_ratios = ["1/4", "1/3", "1/2", "2/3", "3/4"]
gap = 0.0
border_width = 3.0

[window_quick.bindings]
"?" = "key_help"
h = "window_layout_left"
j = "window_layout_down"
k = "window_layout_up"
l = "window_layout_right"
e = "window_editor"
r = "window_restore"
tab = "window_select"
"shift+tab" = "window_select_previous"
"v+j" = "window_volume_down"
"v+k" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+h" = "window_audio_previous"
"v+l" = "window_audio_next"
"shift+v+j" = "window_system_volume_down"
"shift+v+k" = "window_system_volume_up"
"shift+v+h" = "window_system_audio_previous"
"shift+v+l" = "window_system_audio_next"
z = "window_undo"
"shift+z" = "window_redo"
"shift+c" = "window_reset_initial"
q = "window"
"primary+q" = "idle"

[window_quick.ui]
font_size = 28

# Editor: tile windows and adjust their regions.
[window_editor]
screens = "current"
include_minimized = false
enabled = true
inherits = ["hotkeys"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]
number_timeout_ms = 250
resize_step = 20.0
resize_speed = 500.0
gap = 0.0
border_width = 3.0

[window_editor.bindings]
"`" = "window_area_number"
"?" = "key_help"
h = "window_layout_left"
j = "window_layout_down"
k = "window_layout_up"
l = "window_layout_right"
"shift+h" = "window_split_left"
"shift+j" = "window_split_down"
"shift+k" = "window_split_up"
"shift+l" = "window_split_right"
"ctrl+h" = "window_ratio_left"
"ctrl+j" = "window_ratio_down"
"ctrl+k" = "window_ratio_up"
"ctrl+l" = "window_ratio_right"
tab = "window_select"
"shift+tab" = "window_select_previous"
"v+j" = "window_volume_down"
"v+k" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+h" = "window_audio_previous"
"v+l" = "window_audio_next"
"shift+v+j" = "window_system_volume_down"
"shift+v+k" = "window_system_volume_up"
"shift+v+h" = "window_system_audio_previous"
"shift+v+l" = "window_system_audio_next"
z = "window_undo"
"shift+z" = "window_redo"
"shift+c" = "window_reset_initial"
x = "window_remove_region"
"ctrl+s" = "window_save_layout"
r = "window_restore"
q = "window"
"primary+q" = "idle"

# Editor overrides only the shared card position.
[window_editor.card]
position_mode = "window"
position = ["0%", "50%", "100%", "50%"]

[window_editor.ui]
font_size = 28

# Restore: saved workspace layouts.
[window_restore]
screens = "current"
include_minimized = false
enabled = true
inherits = ["hotkeys"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]
number_timeout_ms = 250
gap = 0.0
border_width = 3.0

[window_restore.lifecycle]
after_finish = "window_editor"
after_click = "keep"

[window_restore.bindings]
page_up = "window_previous_page"
page_down = "window_next_page"
"?" = "key_help"
x = "window_delete"
enter = "window_confirm"
q = "window"
"primary+q" = "idle"

[window_restore.ui]
font_size = 28

# Tabs: 12t34t creates two groups; ~ selects a group number.
[window_tab]
screens = "current"
include_minimized = false
enabled = true
inherits = ["hotkeys"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]
number_timeout_ms = 250
border_width = 3

[window_tab.bindings]
"?" = "key_help"
t = "window_tab_end"
"~" = "window_tab_group"
space = "window_number_end"
d = "window_tab_remove"
x = "window_tab_dissolve"
tab = "window_tab_next"
"shift+tab" = "window_tab_previous"
h = "move_left"
j = "move_down"
k = "move_up"
l = "move_right"
z = "window_undo"
"shift+z" = "window_redo"
"ctrl+s" = "window_save_layout"
r = "window_restore"
q = "window"
"primary+q" = "idle"
esc = "idle"

[window_tab.ui]
font_size = 28

# UI Hint: type a label to click; / searches names, OCR and Chinese initials.
# scan_scope: window (pointer window first), active (focused window first),
# screen (pointer's display), all (all displays). Display scopes scan visible UI.
# strategy: hybrid (default), axtree, vision or contour.
# Advanced OCR/contour thresholds and roles use built-in defaults; see --dump-config.
[ui_hint]
search_copy_keys = ["ctrl+1", "ctrl+2", "ctrl+3", "ctrl+4"] # OCR / accessibility / coordinates / color.
scan_scope = "all"
enabled = true
strategy = "hybrid"
hint_characters = "asdfghjkl"
inherits = ["hotkeys", "normal"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]
overlap_cycle_key = "shift" # Hold to cycle overlapping labels.
label_direction = "normal" # "normal" or "reverse".
search_match_priority = ["pinyin", "text", "label"] # Each of pinyin/text/label once; equal-quality ties.
max_depth = 50 # 0 = unlimited.
scan_timeout_ms = 2500
scan_retry_count = 1
scan_retry_delay_ms = 200
ignore_clickable_check = false
visible_check_enabled = false # Hit-testing occluded controls costs extra time.
placement = "bottom" # "top", "center" or "bottom".
label_x_offset = 0
label_y_offset = -8

# Completion actions: keep, restart, return, a mode or a click; after_click also accepts finish.
[ui_hint.lifecycle]
after_finish = "normal"
after_click = "normal"

[ui_hint.bindings]
enter = "confirm_selection"
esc = "cancel_selection"
backspace = "previous_level"
tab = "reopen_selection"
"/" = "search_selection"
"primary+r" = "rescan"
"primary+q" = "normal"

[ui_hint.ui]
font_size = 17
font_family = ""
border_width = 1
border_radius = -1 # -1 = automatic; also applies to padding.
padding_x = -1
padding_y = -1

# Optional element outlines.
[ui_hint.boundary_highlight]
enabled = false
border_width = 1
border_radius = -1

# Keys = editing action; omitted actions inherit their defaults.
[ui_hint.search_edit_keys]
"enter / primary+q" = "accept"
"esc" = "cancel"
"primary+v" = "paste"
"primary+c" = "copy"
"primary+x" = "cut"
"primary+a" = "select_all"
"left" = "left"
"right" = "right"
"home" = "home"
"end" = "end"
"shift+left" = "select_left"
"shift+right" = "select_right"
"shift+home" = "select_home"
"shift+end" = "select_end"
"backspace" = "backspace"
"delete" = "delete"

# Ctrl toggles point adjustment; Tab previews results or switches selected points.
[ui_hint.search_bindings]
ctrl = "point_toggle"
tab = "point_next"
"ctrl+shift+4" = "color_next"

# Position arrays are [top, right, bottom, left], relative to position_mode.
[ui_hint.search_input_ui]
position_mode = "screen" # "screen" or "window".
position = ["95%", "50%", "5%", "50%"]
width = 280
font_size = 14
padding_y = 6

# Four result slots: OCR, accessibility, coordinates and color.
[ui_hint.search_info_ui]
position_mode = "search_input" # "search_input", "screen" or "window".
position = ["44%", "50%", "56%", "50%"] # Above the input, with a small gap.
width = 520
font_size = 14
padding_y = 16

# Grid: select max_depth nested cells, then return to Normal.
[grid]
enabled = true
grid_cols = 5
grid_rows = 4
keys = "12345qwertasdfgzxcvb"
max_depth = 3
inherits = ["hotkeys", "normal"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]
cursor_follow_selection = true

[grid.lifecycle]
after_finish = "normal"
after_click = "finish"

[grid.bindings]
u = "area_hint"
i = "area_text"
enter = "confirm_selection" # 确认当前选择
esc = "cancel_selection" # 取消选择，返回来源模式
"tab backspace" = "previous_level" # Tab 或 Backspace：返回上一层
space = "first_level" # 回到第一层，重新选择
"`" = "follow"
"primary+q" = "normal"

[grid.ui]
font_size = 20
border_width = 1

# Recursive Grid: Backspace widens, Space resets, Enter clicks the current centre.
[recursive_grid]
enabled = true
grid_cols = 3
grid_rows = 3
keys = "qweasdzxc"
min_size_width = 1
min_size_height = 1
max_depth = 10
cursor_follow_selection = true
inherits = ["hotkeys", "normal"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]

[recursive_grid.lifecycle]
after_finish = "keep"
after_click = "keep"

[recursive_grid.bindings]
u = "area_hint"
i = "area_text"
enter = "confirm_selection" # 确认当前选择
esc = "cancel_selection" # 取消选择，返回来源模式
"tab backspace" = "previous_level" # Tab 或 Backspace：返回上一层
space = "first_level" # 回到第一层，重新选择
"`" = "follow"
"primary+q" = "normal"

# font_size = 0 sizes letters automatically; empty label_char keeps normal labels.
[recursive_grid.ui]
font_size = 0
label_min_font_size = 6
line_width = 1
label_background = false
label_char = ""
label_autohide_multiplier = 1.5
sub_key_preview = false
sub_key_preview_font_size = 8
sub_key_preview_autohide_multiplier = 1.5

# Bisect: choose a half with h/j/k/l; no labels or configurable grid alphabet.
[bisect]
enabled = true
min_size_width = 2
min_size_height = 2
max_depth = 20
cursor_follow_selection = true
inherits = ["hotkeys", "normal"]
temporary_mode = "normal"
temporary_mode_keys = ["primary"]

[bisect.lifecycle]
after_finish = "keep"
after_click = "keep"

[bisect.bindings]
h = "bisect_left"
j = "bisect_down"
k = "bisect_up"
l = "bisect_right"
u = "area_hint"
i = "area_text"
enter = "confirm_selection"
esc = "cancel_selection"
"tab backspace" = "previous_level"
space = "first_level"
"`" = "follow"
"primary+q" = "normal"

[bisect.ui]
line_width = 1

# Distances are pixels; speed is pixels/second when held (0 = tap only).
[scroll]
speed = 500.0
scroll_step = 50
scroll_step_half = 500
scroll_step_full = 1000000

# macOS wheel direction.
[platform.macos.scroll]
invert_horizontal = false
invert_vertical = true

# Pointer speed: pixels/second; acceleration: pixels/second².
[pointer]
initial_speed = 1000.0
max_speed = 2200.0
acceleration = 3000.0
smooth_acceleration = true
tap_distance = 2.5
slow_multiplier = 0.35
precision_multiplier = 0.12
fast_multiplier = 2.0

# Cursor ring and held-button colors.
[mode_indicator.cursor]
enabled = true
radius = 13
stroke_width = 2
left_pressed_color = "#00FF00FF"
middle_pressed_color = "#FF00FFFF"
right_pressed_color = "#00FFFFFF"

# Shared mode badge. indicator_offset is [X, Y] from the cursor hotspot.
[mode_indicator.ui]
font_size = 11
font_family = ""
border_radius = -1
padding_x = -1
padding_y = -1
border_width = 1
indicator_offset = [-12, 18]

# Individual modes may override enabled, text, cursor and ui.
[mode_indicator.modes.normal]
enabled = true
text = "Normal"

[mode_indicator.modes.text_input]
enabled = false

# Preserve targeting selections when switching displays.
[plugin_modes."plugin:screen-selector".bindings]
esc = "cancel_selection"
enter = "confirm_selection"
backspace = "previous_level"

[plugin_modes."plugin:screen-selector".settings]
preserve = true

# Save usage after this many entries and on orderly exit; no periodic save timer.
[mode_usage]
save_after_entries = 100

# Hold Q to open the mode switcher; a short tap keeps the current mode binding.
[quick_switch]
enabled = true
key = "q"
hint_characters = "wertyuiop" # UI Hint labels; more modes use multi-character labels.
hold_ms = 350
blacklist = ["idle"]
position = "mouse" # "mouse", "screen" or "window".

# The mode remains open after releasing the trigger. Omit an exit key to disable it.
[quick_switch.bindings]
esc = "cancel_selection"
q = "cancel_selection"
backspace = "previous_level"

[quick_switch.ui]
font_size = 28
font_family = ""
border_radius = -1
padding_x = 10
padding_y = -1
border_width = 1

# ? toggles help; these switches only set its initial visibility.
[key_help]
window_key_help = true
mouse_key_help = false
font_family = ""
font_size = 12.0
border_width = 0.0
border_radius = 10.0
padding_x = 24.0
padding_y = 8.0
