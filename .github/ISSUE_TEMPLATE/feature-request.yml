name: 功能建议
description: 提议新的操作、模式、配置能力或体验改进。
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。简单描述使用场景和你希望的体验即可。
  - type: textarea
    id: proposal
    attributes:
      label: 功能建议
      description: 你遇到了什么不便？希望 KeySteer 如何改进？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 可附示例配置、草图、截图、参考链接或替代方案。
