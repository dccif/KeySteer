name: 配置或按键问题
description: 反馈 TOML、配置发现、按键绑定或模式行为的使用问题。
title: "[Config]: "
body:
  - type: markdown
    attributes:
      value: |
        请说明你想实现什么；请勿粘贴包含私密路径、命令或凭据的完整配置。
  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 请简单说明目标、当前行为，以及卡住的地方。
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 相关配置（可选）
      description: 可粘贴脱敏后的相关 TOML 片段，并注明配置文件名。
      render: toml
  - type: input
    id: environment
    attributes:
      label: 版本与环境（可选）
      placeholder: 例如 KeySteer 1.0.0，macOS 15 Apple Silicon
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 可附 `keysteer --doctor` 输出、日志或截图。
