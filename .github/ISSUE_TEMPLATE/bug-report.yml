name: 错误报告
description: 报告可复现的 KeySteer 行为、输入或覆盖层问题。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请提供必要信息；请注意删除私密内容。
  - type: textarea
    id: details
    attributes:
      label: 问题描述
      description: 请简单说明发生了什么、预期是什么；如能稳定复现，也请附上步骤。
      placeholder: |
        实际行为：
        预期行为：
        复现方式：
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 可选：KeySteer 版本、Windows/macOS 版本和处理器架构。
      placeholder: 例如 KeySteer 1.0.0，Windows 11 x64
  - type: textarea
    id: config
    attributes:
      label: 相关配置（可选）
      description: 如与配置有关，请粘贴脱敏后的相关 TOML 片段。
      render: toml
  - type: textarea
    id: diagnostics
    attributes:
      label: 补充信息（可选）
      description: 可附 `keysteer --doctor` 输出、日志、截图或其他线索。
      render: text
