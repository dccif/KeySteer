name: Build and publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build (publishing always builds all platforms)
        required: true
        default: all
        type: choice
        options:
          - windows
          - macos
          - all
      publish:
        description: Publish the packages as a GitHub Release
        required: true
        default: true
        type: boolean
      release_type:
        description: Release type (used only when publishing)
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.publish || inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install required Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal

      - name: Install Rust targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Sync package version in Cargo.lock
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          cargo update --package keysteer --precise "$version"

      - name: Package Windows x64
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Target x86_64-pc-windows-msvc

      - name: Package Windows ARM64
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Target aarch64-pc-windows-msvc -SkipConfigCheck

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: KeySteer-Windows-x64
          path: dist/x86_64-pc-windows-msvc/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows ARM64 package
        uses: actions/upload-artifact@v7
        with:
          name: KeySteer-Windows-ARM64
          path: dist/aarch64-pc-windows-msvc/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    if: ${{ inputs.publish || inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install required Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Sync package version in Cargo.lock
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          cargo update --package keysteer --precise "$version"

      - name: Package macOS Apple Silicon
        shell: bash
        run: bash packaging/macos/package.sh aarch64-apple-darwin

      - name: Package macOS Intel
        shell: bash
        run: bash packaging/macos/package.sh x86_64-apple-darwin

      - name: Upload macOS Apple Silicon package
        uses: actions/upload-artifact@v7
        with:
          name: KeySteer-macOS-Apple-Silicon
          path: dist/aarch64-apple-darwin/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS Intel package
        uses: actions/upload-artifact@v7
        with:
          name: KeySteer-macOS-Intel
          path: dist/x86_64-apple-darwin/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ inputs.publish }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Compose current release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          bash tools/compose-release-notes.sh "$VERSION" release-body.md
          cat release-body.md

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: KeySteer-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)" -eq 0
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "$RELEASE_TYPE" == "pre-release" ]]; then
            tag="v$VERSION-pre.$GITHUB_RUN_NUMBER"
            title="KeySteer v$VERSION pre-release #$GITHUB_RUN_NUMBER"
            prerelease_flag=(--prerelease)
          else
            tag="v$VERSION"
            title="KeySteer v$VERSION"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            "${prerelease_flag[@]}" \
            --generate-notes \
            --notes "$(cat release-body.md)" \
            release-assets/*.zip
