name: Package and publish

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Packages to build
        required: true
        default: all
        type: choice
        options:
          - windows
          - macos
          - all
      publish:
        description: Publish the packages as a GitHub Release
        required: true
        default: true
        type: boolean
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: read

jobs:
  windows:
    name: Package Windows ${{ matrix.arch }}
    if: ${{ inputs.publish || inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            artifact: KeySteer-Windows-x64
            package_args: ""
          - arch: ARM64
            target: aarch64-pc-windows-msvc
            artifact: KeySteer-Windows-ARM64
            package_args: -SkipConfigCheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Sync package version in Cargo.lock
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          cargo update --package keysteer --precise "$version"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Restore Rust release cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/.fingerprint
          key: ${{ runner.os }}-${{ matrix.target }}-rust-stable-release-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-stable-release-

      - name: Prepare Windows code-signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is required for Windows release artifacts"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "keysteer-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          )
          "KEYSTEER_SIGNING_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Windows ${{ matrix.arch }}
        shell: pwsh
        timeout-minutes: 30
        env:
          KEYSTEER_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          KEYSTEER_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./packaging/windows/package.ps1 -Target ${{ matrix.target }} -RequireSigning ${{ matrix.package_args }}

      - name: Upload Windows ${{ matrix.arch }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Package macOS ${{ matrix.arch }}
    if: ${{ inputs.publish || inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
            artifact: KeySteer-macOS-Apple-Silicon
          - arch: Intel
            target: x86_64-apple-darwin
            artifact: KeySteer-macOS-Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Sync package version in Cargo.lock
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          cargo update --package keysteer --precise "$version"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Restore Rust release cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/.fingerprint
          key: ${{ runner.os }}-${{ matrix.target }}-rust-stable-release-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-stable-release-

      - name: Package macOS ${{ matrix.arch }}
        shell: bash
        timeout-minutes: 30
        run: bash packaging/macos/package.sh ${{ matrix.target }}

      - name: Upload macOS ${{ matrix.arch }} package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.target }}/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    # A public release must contain every supported platform. Partial manual
    # builds still retain their downloadable workflow artifacts.
    if: ${{ inputs.publish }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Compose current release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          bash tools/compose-release-notes.sh "$VERSION" release-body.md
          cat release-body.md

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: KeySteer-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)" -eq 0
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "$RELEASE_TYPE" == "pre-release" ]]; then
            tag="v$VERSION-pre.$GITHUB_RUN_NUMBER"
            title="KeySteer v$VERSION pre-release #$GITHUB_RUN_NUMBER"
            prerelease_flag=(--prerelease)
          else
            tag="v$VERSION"
            title="KeySteer v$VERSION"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            "${prerelease_flag[@]}" \
            --generate-notes \
            --notes "$(cat release-body.md)" \
            release-assets/*.zip
