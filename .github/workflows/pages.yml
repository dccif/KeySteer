name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/sync-doc-assets.mjs"
      - "assets/icons/**"
      - "keysteer.default.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test documentation models
        run: pnpm docs:test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build VitePress site
        env:
          KEYSTEER_DOCS_BASE: /KeySteer/
        run: pnpm docs:build

      # upload-pages-artifact@v4 internally uses the Node 20 upload action.
      # Package the documented Pages artifact directly so every action here
      # uses a Node 24 runtime.
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs/.vitepress/dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
