name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate current version release notes
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^" ]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          bash tools/compose-release-notes.sh "$version" "$output"
          test -s "$output"

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.97 --profile minimal --component rustfmt,clippy
      - run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo check --locked --target aarch64-pc-windows-msvc --all-targets

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.97 --profile minimal --component clippy
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo check --locked --target x86_64-apple-darwin --all-targets

  portable-miri:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test --locked domain::
